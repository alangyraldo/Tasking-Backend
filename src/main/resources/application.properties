spring.application.name=tasking-backend
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/task_planner_db?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true